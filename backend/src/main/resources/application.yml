app:
  mail:
    from: "Cafe <prdc.team01@gmail.com>"
spring:
  datasource:
    url: ${DB_JDBC_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    defer-datasource-initialization: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: prdc.team01
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.from: prdc.team01@gmail.com

    logging:
      level:
        org.springframework.web: DEBUG
        org.springframework.mail: DEBUG
        jakarta.mail: DEBUG

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

order:
  schedule:
    cron: 0 0 14 * * ?